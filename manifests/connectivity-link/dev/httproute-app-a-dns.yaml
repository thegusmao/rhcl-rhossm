# HTTPRoute — expõe aplicacao-a via Gateway edge (RHCL)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-a-firesoft
  namespace: app-a
  labels:
    app: aplicacao-a
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge-gateway
      namespace: ingress-gateway
      sectionName: http
  hostnames:
    - app-a.firesoft.com.br
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aplicacao-a
          port: 8080
