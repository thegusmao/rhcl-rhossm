# Gateway north-south HTTPS — Firesoft external CA (*.external.firesoft.com.br)
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: secure-gateway
  namespace: ingress-gateway
  labels:
    kuadrant.io/gateway: "true"
spec:
  gatewayClassName: istio
  listeners:
    - name: https-external-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.external.firesoft.com.br"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: secure-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
