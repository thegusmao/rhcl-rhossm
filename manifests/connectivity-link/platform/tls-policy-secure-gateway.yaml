# TLSPolicy — emite/renova secure-gateway-tls via intermediate external Firesoft
---
apiVersion: kuadrant.io/v1
kind: TLSPolicy
metadata:
  name: secure-gateway-tls
  namespace: ingress-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: secure-gateway
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: firesoft-external
