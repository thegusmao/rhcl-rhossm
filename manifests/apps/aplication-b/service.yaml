# Service ClusterIP na porta 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aplicacao-b
  namespace: app-b
  labels:
    app: aplicacao-b
    version: v1
    app.kubernetes.io/component: aplicacao-b
    app.kubernetes.io/instance: aplicacao-b
spec:
  type: ClusterIP
  selector:
    deployment: aplicacao-b
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
