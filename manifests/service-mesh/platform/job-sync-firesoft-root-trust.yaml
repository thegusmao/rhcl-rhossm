# Publica a Root Firesoft (tls.crt) em ConfigMap para o istio-csr distribuir nos sidecars.
# Lê firesoft-root-ca em cert-manager (PKI foundation) — sem chave privada no Git.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sync-firesoft-root-trust
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sync-firesoft-root-trust
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["firesoft-root-ca"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-firesoft-root-trust
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sync-firesoft-root-trust
subjects:
  - kind: ServiceAccount
    name: sync-firesoft-root-trust
    namespace: istio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sync-firesoft-root-trust
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sync-firesoft-root-trust-istio-ca-root-cert
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sync-firesoft-root-trust-istio-ca-root-cert
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sync-firesoft-root-trust-istio-ca-root-cert
subjects:
  - kind: ServiceAccount
    name: sync-firesoft-root-trust
    namespace: istio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-firesoft-root-trust
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sync-firesoft-root-trust
subjects:
  - kind: ServiceAccount
    name: sync-firesoft-root-trust
    namespace: istio-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-firesoft-root-trust
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: sync-firesoft-root-trust
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              ROOT_PEM=$(oc get secret firesoft-root-ca -n cert-manager -o jsonpath='{.data.tls\.crt}' | base64 -d)
              oc create configmap firesoft-istio-trust -n istio-system \
                --from-literal=root-cert.pem="${ROOT_PEM}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "firesoft-istio-trust ConfigMap updated"
              for ns in $(oc get ns -l istio-discovery=enabled -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
                oc create configmap istio-ca-root-cert -n "${ns}" \
                  --from-literal=root-cert.pem="${ROOT_PEM}" \
                  --dry-run=client -o yaml | oc apply -f -
                echo "istio-ca-root-cert updated in ${ns}"
              done
