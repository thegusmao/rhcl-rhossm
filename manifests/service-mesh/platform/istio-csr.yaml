# istio-csr — mTLS mesh via cert-manager (Issuer em istio-system + trust Firesoft root)
#
# Pré-requisitos (sync-wave):
#   2 — CronJob sync-firesoft-mesh-trust → firesoft-istio-trust + istio-ca-root-cert
#   1 — Certificate firesoft-internal-ca + Issuer firesoft-internal (istio-system)
#   2 — ClusterIssuers PKI (foundation-pki)
---
apiVersion: operator.openshift.io/v1alpha1
kind: IstioCSR
metadata:
  name: default
  namespace: istio-csr
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  istioCSRConfig:
    certManager:
      issuerRef:
        name: firesoft-internal
        kind: Issuer
        group: cert-manager.io
      istioCACertificate:
        name: firesoft-istio-trust
        namespace: istio-system
        key: root-cert.pem
    istioDataPlaneNamespaceSelector: istio-discovery=enabled
    istiodTLSConfig:
      trustDomain: cluster.local
    istio:
      namespace: istio-system
    logLevel: 1
