# Intermediate CA — internal.firesoft.com.br (mTLS mesh / istio-csr)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: firesoft-internal-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isCA: true
  commonName: Firesoft Internal Issuing CA
  secretName: firesoft-internal-ca
  duration: 43800h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
  subject:
    organizations:
      - Firesoft
    organizationalUnits:
      - internal.firesoft.com.br
  issuerRef:
    name: firesoft-root
    kind: ClusterIssuer
    group: cert-manager.io
