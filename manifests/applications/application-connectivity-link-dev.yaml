# Application connectivity-link-dev — HTTPRoutes e políticas RHCL por aplicação
#
# sync-wave 5: depende do Gateway (connectivity-link-infra).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: connectivity-link-dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: dev
  source:
    repoURL: https://github.com/thegusmao/rhcl-rhossm.git
    targetRevision: main
    path: manifests/connectivity-link/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
