# Application service-mesh-infra — Istio, IstioCNI, Kiali, OpenTelemetry
#
# sync-wave 2: depende dos namespaces (infra) e dos CSVs (foundation).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-mesh-infra
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: infra
  source:
    repoURL: https://github.com/thegusmao/rhcl-rhossm.git
    targetRevision: main
    path: manifests/infra/service-mesh
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
