# Application dev — workload aplicacao-b (S2I Flask) em app-b
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aplicacao-b
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: dev
  source:
    repoURL: https://github.com/thegusmao/rhcl-rhossm.git
    targetRevision: main
    path: manifests/apps/aplication-b
  destination:
    server: https://kubernetes.default.svc
    namespace: aplicacao-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
