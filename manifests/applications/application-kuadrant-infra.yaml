# Application kuadrant-infra — CR Kuadrant (RHCL)
#
# sync-wave 3: depende do OSSM e do namespace kuadrant-system (infra).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kuadrant-infra
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: infra
  source:
    repoURL: https://github.com/thegusmao/rhcl-rhossm.git
    targetRevision: main
    path: manifests/infra/connectivity-link
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
