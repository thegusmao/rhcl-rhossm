# Application connectivity-link-infra — Gateway, GatewayClass e políticas RHCL (edge)
#
# sync-wave 4: depende de kuadrant-infra e service-mesh-infra.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: connectivity-link-infra
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: infra
  source:
    repoURL: https://github.com/thegusmao/rhcl-rhossm.git
    targetRevision: main
    path: manifests/connectivity-link/platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
