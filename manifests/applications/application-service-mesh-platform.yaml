# Application service-mesh-platform — istio-csr, PeerAuthentication secure
#
# sync-wave 3: depende de PKI (firesoft-internal) e service-mesh-infra.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-mesh-platform
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: infra
  source:
    repoURL: https://github.com/thegusmao/rhcl-rhossm.git
    targetRevision: main
    path: manifests/service-mesh/platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
